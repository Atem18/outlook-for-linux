# Local Flatpak build: wraps the electron-builder output in dist/linux-unpacked.
# Build with `npm run dist:flatpak` (needs the org.flatpak.Builder app).
#
# TODO(flathub): Flathub builds offline from source, so submission needs the
# npm dependencies vendored with flatpak-node-generator instead of the
# prebuilt directory used here.
id: io.github.Atem18.OutlookForLinux
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: outlook-for-linux
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  # App Icon: a copy of the chosen icon in the user icon theme, so the
  # taskbar and launcher follow (app/appIcon/themeIcon.js). Nothing else of
  # ~/.local/share is visible.
  - --filesystem=xdg-data/icons:create
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop
modules:
  - name: outlook-for-linux
    buildsystem: simple
    build-commands:
      - cp -a linux-unpacked /app/main
      - install -Dm755 outlook-for-linux.sh /app/bin/outlook-for-linux
      - install -Dm644 ${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - for size in 16 32 48 64 128 256 512; do
          install -Dm644 icons/${size}x${size}.png /app/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png;
        done
    sources:
      - type: dir
        path: ../dist/linux-unpacked
        dest: linux-unpacked
      - type: dir
        path: ../build/icons
        dest: icons
      - type: file
        path: outlook-for-linux.sh
      - type: file
        path: io.github.Atem18.OutlookForLinux.desktop
      - type: file
        path: io.github.Atem18.OutlookForLinux.metainfo.xml
